<!DOCTYPE html>
<html>
<head>
  <title>Oceanic 🌊</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style>
    body { margin:0; overflow:hidden; background:#001e3c; }
    #ui {
      position:absolute; bottom:0; left:0; width:300px;
      background:rgba(0,0,0,0.4); color:white; backdrop-filter:blur(10px);
    }
    #chat { height:120px; overflow:auto; padding:5px; }
    #controls { display:flex; }
    input { flex:1; padding:8px; border:none; background:rgba(255,255,255,0.1); color:white; }
    button { border:none; background:none; color:white; padding:8px; cursor:pointer; }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  <div id="chat"></div>
  <div id="controls">
    <input id="input" placeholder="type..." />
    <button id="sendBtn"><span class="material-symbols-outlined">send</span></button>
    <button id="muteBtn"><span class="material-symbols-outlined">mic</span></button>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
